[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fishmip-cesm2-preprocessing"
version = "0.1.0"
description = "Preprocess CESM2 POP2/MARBL ocean output into FishMIP forcing"
requires-python = ">=3.10"
dependencies = ["xarray", "numpy", "netcdf4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pandas"]

[project.scripts]
fishmip-verify-inputs = "fishmip_cesm.verify_inputs:main"
fishmip-inspect-source = "fishmip_cesm.inspect_source:main"
fishmip-make-weights = "fishmip_cesm.make_weights:main"
fishmip-check-regrid = "fishmip_cesm.check_regrid:main"
fishmip-dry-run = "fishmip_cesm.dry_run:main"

[tool.setuptools]
packages = ["fishmip_cesm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
